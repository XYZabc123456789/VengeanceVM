[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.105"
walrus = "0.27.2"
wasm-bindgen = "0.2.128"
web-sys = { version = "0.3.105", features = ["console"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1 
strip = "debuginfo"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O4']
